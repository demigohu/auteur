[project]
name = "auteur-labs-api"
version = "0.1.0"
description = "Auteur Labs backend: agent loop, Meta Model API, ffmpeg pipeline"
authors = [
    { name = "demigohu", email = "tgraji.k@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.2",
    "pyjwt[crypto]==2.10.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auteur"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
