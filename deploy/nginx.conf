# Auteur behind an nginx that already serves other sites. Replace auteur.example.com with your domain:
#   sed 's/auteur.example.com/auteurlabs.xyz/g' deploy/nginx.conf > /etc/nginx/sites-available/auteur
# Ports 3100 (web) and 8100 (API) come from deploy/docker-compose.nginx.yml. HTTPS is added by certbot.

# The agent's event stream and long renders: no buffering, long timeouts.
map $http_upgrade $auteur_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name auteur.example.com;

    client_max_body_size 600m;  # uploads (footage, music, LUTs)

    # The API under /api, prefix stripped (the editor is built with https://<domain>/api).
    location /api/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;           # events reach the browser as they happen
        proxy_cache off;
        proxy_request_buffering off;   # big uploads stream straight through
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $auteur_connection;
    }
}

# The same API on its own subdomain, for direct calls and /docs.
server {
    listen 80;
    listen [::]:80;
    server_name api.auteur.example.com;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
