# Production on one VPS: Caddy (HTTPS) -> web (Next.js) and api (FastAPI, ffmpeg).
# Setup: copy deploy/.env.example to .env, fill it in, then `docker compose up -d --build`.
services:
  api:
    # Repository root as context: the API image also carries motion/ (the Remotion renderer).
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ./api/.env
    environment:
      # These win over api/.env, whose values are meant for local development.
      CORS_ORIGINS: https://${DOMAIN}
      AUTEUR_DATA_DIR: /data
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      # Spend guards, set in the root .env (see deploy/.env.example).
      USER_SPEND_CAP_USD: ${USER_SPEND_CAP_USD:-3}
      SPEND_CAP_USD: ${SPEND_CAP_USD:-25}
      RUNS_PER_VISITOR_PER_DAY: ${RUNS_PER_VISITOR_PER_DAY:-0}
    volumes:
      - auteur-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  auteur-data:
  caddy-data:
